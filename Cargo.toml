[package]
name = "keyword-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
csv = "1"
calamine = "0.26"
rust_xlsxwriter = "0.79"
zip = "=2.4.2"
serde_json = "1"
regex = "1"
rust-stemmers = "1.2"
# Единственный HTTP-клиент для всех ОС.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "charset", "system-proxy"] }
open = "5"

# Windows/macOS: системный TLS (Schannel/Security Framework).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

# Linux и прочие ОС: rustls — без системного OpenSSL для HTTP.
[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
